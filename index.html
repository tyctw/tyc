<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>桃園會考歷年錄取分數查詢系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="https://tyctw.github.io/Navigation/tyctw.png">
</head>
<body>
  <header>
    <nav>
      <a href="https://tyctw.github.io/tyc/" class="logo">桃園會考錄取分數查詢</a>
      <div class="nav-links">
        <div class="menu-header">
          <i class="fas fa-compass"></i> 網站導覽
        </div>
        <div class="menu-content">
          <a href="https://sites.google.com/view/tyctw/" style="--i:0">
            <i class="fas fa-home"></i>
            <span>回主網頁</span>
            <i class="fas fa-chevron-right arrow"></i>
          </a>
          <a href="https://tyctw.github.io/" style="--i:1">
            <i class="fas fa-chart-line"></i>
            <span>落點分析</span>
            <i class="fas fa-chevron-right arrow"></i>
          </a>
          <a href="https://tyctw.github.io/Navigation/" style="--i:2">
            <i class="fas fa-info-circle"></i>
            <span>更多資訊</span>
            <i class="fas fa-chevron-right arrow"></i>
          </a>
          <a href="#" style="--i:3">
            <i class="fas fa-question-circle"></i>
            <span>常見問題</span>
            <i class="fas fa-chevron-right arrow"></i>
          </a>
          <a href="#" style="--i:4">
            <i class="fas fa-newspaper"></i>
            <span>最新公告</span>
            <i class="fas fa-chevron-right arrow"></i>
          </a>
        </div>
      </div>
      <div class="menu-backdrop"></div>
      <button class="menu-toggle" aria-label="開啟選單">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </button>
      <button class="desktop-menu-button">選單</button>
    </nav>
  </header>

  <button id="toggleView" title="切換檢視模式">📱</button>
  <div class="container fade-in">
    <h1>桃園會考錄取分數查詢</h1>
    <form id="searchForm">
      <div class="form-group">
        <label for="year">年度：</label>
        <select id="year" name="year">
          <option value="113">113年</option>
          <option value="112">112年</option>
          <option value="111">111年</option>
          <option value="110">110年</option>
        </select>
      </div>
      <div class="form-group">
        <label for="schoolName">學校名稱：</label>
        <input type="text" id="schoolName" name="schoolName" placeholder="輸入學校名稱">
      </div>
      <div class="form-group">
        <label for="department">群別：</label>
        <select id="department" name="department">
          <option value="">全部</option>
          <option value="普通科">普通科</option>
          <option value="機械群">機械群</option>
          <option value="動力機械群">動力機械群</option>
          <option value="電機與電子群">電機與電子群</option>
          <option value="化工群">化工群</option>
          <option value="土木與建築群">土木與建築群</option>
          <option value="商業與管理群">商業與管理群</option>
          <option value="外語群">外語群</option>
          <option value="設計群">設計群</option>
          <option value="農業群">農業群</option>
          <option value="食品群">食品群</option>
          <option value="家政群">家政群</option>
          <option value="餐旅群">餐旅群</option>
        </select>
      </div>
      <div class="form-group">
        <label for="minScore">最低分數：</label>
        <select id="minScore" name="minScore">
          <option value="">全部</option>
          <option value="5A">5A以上</option>
          <option value="4A">4A以上</option>
          <option value="3A">3A以上</option>
          <option value="2A">2A以上</option>
          <option value="1A">1A以上</option>
          <option value="5B">5B以上</option>
          <option value="4B">4B以上</option>
          <option value="3B">3B以上</option>
        </select>
      </div>
      <button type="submit"><span>搜尋</span></button>
    </form>
    
    <div id="resultContainer"></div>
    <div id="resultMessage"></div>
    <div class="pagination">
      <button id="prevPage"><span>上一頁</span></button>
      <span id="pageInfo"></span>
      <button id="nextPage"><span>下一頁</span></button>
    </div>
  </div>

  <footer>
    <div>桃園會考錄取分數查詢系統</div>
    <div class="copyright">&copy; 2025 TYCTW會考落點分析平台. All rights reserved.</div>
  </footer>

  <!-- 搜尋特效覆蓋層 -->
  <div class="search-overlay">
    <div class="search-spinner"></div>
    <div class="search-message">正在搜尋中...</div>
  </div>

  <!-- 載入特效覆蓋層 -->
  <div class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-message">載入中...</div>
  </div>

  <!-- Comparison Panel -->
  <div id="comparisonPanel" class="comparison-panel">
    <span>已選擇學校：<span id="comparisonCount">0</span></span>
    <button id="compareButton" disabled><span>開始比較</span></button>
    <button id="clearComparison"><span>清除</span></button>
  </div>

  <!-- Comparison Modal -->
  <div id="compareModal" class="compare-modal">
    <div class="compare-modal-content">
      <button id="closeCompareModal" class="close-modal">&times;</button>
      <h2>比較學校結果</h2>
      <div id="compareTableContainer"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
